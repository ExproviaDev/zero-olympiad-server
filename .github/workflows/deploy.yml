name: CI/CD - Backend (Vercel -> VPS)

on:
  push:
    branches: [main] # deploy on every push to main

concurrency:
  group: backend-deploy
  cancel-in-progress: true

jobs:
  # ---------- STAGE 1: Vercel ----------
  vercel:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Deploy to Vercel (production)
        run: |
          npx --yes vercel@latest link --yes --project=zero-backend --token="$VERCEL_TOKEN"
          npx --yes vercel@latest --prod --yes --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

  # ---------- STAGE 2: VPS (only after Vercel succeeds) ----------
  vps:
    name: Deploy to VPS
    needs: vercel
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH (git pull + PM2)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            export PATH=$PATH:/usr/bin:/usr/local/bin:/root/.nvm/versions/node/*/bin
            cd /var/www/zero-backend
            git pull origin main
            # .env stays on the server (it is .gitignored, so git pull never touches it)
            npm ci --omit=dev || npm install --omit=dev
            export PORT=5000
            pm2 restart zero-backend --update-env || pm2 start server.js --name zero-backend
            pm2 save
